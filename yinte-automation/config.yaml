# =============================================================================
# 印特 GUI 自动化 — 配置文件
# =============================================================================

app:
  window_title: "新建工单"
  backend: "win32"
  action_delay: 0.3
  # 补录模式每步额外延时(秒)，值越大越慢。只影响补录(模式2)，不影响新建
  append_delay: 0.4
  # 编号列相对窗口的X位置
  rel_x: 111
  # 第一个空行相对窗口的Y位置
  rel_y_base: 375
  # 行高(每行间隔)
  row_height: 24


# =============================================================================
# 产品代码映射: 子项_尺寸 → 编号代码
# =============================================================================
product_codes:
  # 蓝图
  "蓝图_A0+": "200048"
  "蓝图_A1+": "200043"
  "蓝图_A2+": "200038"
  "蓝图_A0":  "2030"
  "蓝图_A1":  "2031"
  "蓝图_A2":  "2032"
  "蓝图_A3":  "2033"
  "蓝图_A4":  "200108"
  # 复图
  "复图_A0+": "200063"
  "复图_A1+": "200058"
  "复图_A2+": "200053"
  "复图_A0":  "2020"
  # 白图
  "白图_A0+": "2005"
  "白图_A1+": "200073"
  "白图_A2+": "200068"
  "白图_A0":  "2010"
  "白图_A1":  "2011"
  "白图_A2":  "2012"
  "白图_A3":  "2013"
  "白图_A4":  "200113"
  # 彩图
  "彩图_A0+": "200123"
  "彩图_A1+": "200118"
  "彩图_A2+": "200128"
  "彩图_A0":  "200098"
  "彩图_A1":  "200093"
  "彩图_A2":  "200078"
  "彩图_A3":  "200083"
  "彩图_A4":  "200088"
  # 硫酸纸 (单码，不限尺寸)
  "硫酸纸": "200103"


# =============================================================================
# Excel 读取配置
# =============================================================================
excel:
  # 标题行号: 0=自动检测(扫描前20行找"尺寸分类""数量"等列), 正数=指定行号
  header_row: 0

# 从哪个单元格读取子项
subtype_cell: "B4"
# 兜底默认 (B4为空时使用)
default_subtype: "蓝图"

# =============================================================================
# Excel 列名 → 界面字段
# =============================================================================
columns:
  尺寸分类: "尺寸分类"
  子项: ""          # Excel中没有子项列则留空
  数量: "数量"
  份数: "份数"
  页数: "页数"
